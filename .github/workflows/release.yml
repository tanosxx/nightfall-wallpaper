name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match tag to metadata version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = json.loads(Path('extension/nightfall@local/metadata.json').read_text())['version']
          if not re.fullmatch(r'v[1-9][0-9]*', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} does not match metadata version {version!r}')
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install headless build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs libglib2.0-bin python3 gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth
      - name: Check source and bundle validation
        run: bash scripts/check-source.sh
      - name: Check native catalogue interface
        run: xvfb-run -a gjs -m tests/prefs-catalog.test.js
      - name: Build the extension ZIP
        run: >-
          python3 package-extension.py
          --stage "$RUNNER_TEMP/nightfall@local"
          --archive dist/nightfall@local.shell-extension.zip
      - name: Exercise all seven packaged native renderers
        run: python3 scripts/check-packaged-scenes.py "$RUNNER_TEMP/nightfall@local"
      - name: Build installer archive and checksums
        run: >-
          python3 scripts/package-release.py
          --bundle dist/nightfall@local.shell-extension.zip --output dist
      - name: Publish checked release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/nightfall@local.shell-extension.zip \
            "dist/nightfall-${RELEASE_TAG}-linux.tar.gz" \
            dist/SHA256SUMS \
            dist/scenes/*.zip \
            --verify-tag --title "Nightfall ${RELEASE_TAG}" --notes-file docs/RELEASE.md
