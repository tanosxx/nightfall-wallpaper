name: Publish browser preview

# Enable GitHub Pages → Source: GitHub Actions before the first deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install catalogue build runtime
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gjs python3
      - name: Build self-contained preview
        run: python3 scripts/build-pages.py
      - name: Validate static links and public bundle
        run: python3 tests/pages-site.test.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
