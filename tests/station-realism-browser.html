<!doctype html><meta charset="utf-8"><title>Station realism renderer checks</title>
<style>body{background:#07111c;color:#d1e6e5;font:14px monospace}canvas{max-width:90vw}pre{white-space:pre-wrap}</style>
<pre id="result">Running WebGL / Canvas lighting parity…</pre><div id="images"></div>
<base href="../">
<script src="station-relief-data-browser.js"></script><script src="station-realism-lighting-browser.js"></script><script src="station-realism-relief.js"></script>
<script>
(async()=>{const out=document.querySelector('#result'),lines=[];try{
 const photo=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src='assets/station.png';});
 const meta=window.STATION_RELIEF,gpu=await createStationRelief(photo,meta),cpu=await createStationRelief(photo,meta,{forceCanvas:true}),controller=STATION_LIGHTING.createStationLighting();
 if(gpu.backend!=='webgl')throw Error('Expected WebGL renderer');
 const raw=document.createElement('canvas');raw.width=meta.width;raw.height=meta.height;const p=raw.getContext('2d');p.drawImage(photo,0,0);const source=p.getImageData(0,0,meta.width,meta.height).data;
 for(const mode of ['shift','night','service']){controller.setMode(mode,true);for(let i=0;i<120;i++)controller.update(.1);gpu.render(controller.state);cpu.render(controller.state);
  const a=gpu.canvas.getContext('2d').getImageData(0,0,meta.width,meta.height).data,b=cpu.canvas.getContext('2d').getImageData(0,0,meta.width,meta.height).data;let sum=0,max=0,large=0,stars=0,sourceDifference=0;
  for(let i=0;i<a.length;i+=4){let d=0;for(let c=0;c<3;c++){const e=Math.abs(a[i+c]-b[i+c]);sum+=e;sourceDifference+=Math.abs(a[i+c]-source[i+c]);max=Math.max(max,e);d=Math.max(d,e);}if(d>8)large++;const pixel=i/4,x=pixel%meta.width,y=Math.floor(pixel/meta.width);if(x<350&&y<250&&[0,1,2].some(c=>a[i+c]!==source[i+c]))stars++;}
  const mean=sum/(meta.width*meta.height*3), photoMean=sourceDifference/(meta.width*meta.height*3);lines.push(`${mode}: WebGL/Canvas mean=${mean.toFixed(3)}, max=${max}, >8px=${large}; star differences=${stars}; source mean difference=${photoMean.toFixed(3)}`);
  if((mode==='shift'&&photoMean>1)||mean>1.5||large>meta.width*meta.height*.005||stars)throw Error('Lighting parity/stars regression');
 }
 const uniform=document.createElement('canvas');uniform.width=32;uniform.height=1;const q=uniform.getContext('2d');
 for(let x=0;x<32;x++){q.fillStyle=`rgb(${x*8},${x*8},${x*8})`;q.fillRect(x,0,1,1);}
 const mask=document.createElement('canvas');mask.width=32;mask.height=1;const mq=mask.getContext('2d');mq.fillStyle='#fff';mq.fillRect(0,0,32,1);
 const increment=createStationMaterialIncrement(uniform,mask,{x:0,y:0},[.58,.81,1],4),v=increment.getContext('2d').getImageData(0,0,32,1).data;
 if(v[0]||v[1]||v[2])throw Error('Unlit black material gained a flat glow');
 for(let x=1;x<32;x++)for(let c=0;c<3;c++)if(x*8+v[x*4+c]<(x-1)*8+v[(x-1)*4+c])throw Error('Texture contrast inverted');
 lines.push('PASS: local light preserves material ordering and unlit black pixels');
 const image=gpu.canvas;document.querySelector('#images').append(image);lines.push('PASS: all modes, real WebGL, Canvas fallback, fixed star field');out.textContent=lines.join('\n');out.dataset.status='pass';
}catch(e){out.textContent=lines.join('\n')+'\nFAIL: '+e.stack;out.dataset.status='fail';}})();
</script>
