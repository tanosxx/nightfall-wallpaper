<!doctype html><meta charset="utf-8"><title>Cloudcity rotor inspection</title><style>body{background:#080c13;color:#eee;font:14px sans-serif}canvas{border:1px solid #334}button{padding:8px 14px}section{display:flex;gap:8px;margin-top:8px}</style><h1>Source / rotated — real turbine material</h1><p id="state">Loading</p><button id="run">Pause</button><button data-time="0">0 s</button><button data-time="4">4 s</button><button data-time="8">8 s</button><button data-time="16">16 s</button><section><canvas id="large" width="740" height="600"></canvas><canvas id="small" width="440" height="600"></canvas></section><script src="../cloudcity-turbines.js"></script><script>
const photo=new Image();photo.src='../assets/cloudcity.png';photo.onload=()=>{const large=document.getElementById('large').getContext('2d'),small=document.getElementById('small').getContext('2d');const frame=document.createElement('canvas');frame.width=1672;frame.height=941;const c=frame.getContext('2d');const engine=window.createCloudcityTurbines(photo);let paused=false,time=0,last=Date.now();document.querySelector('#run').onclick=()=>{paused=!paused;document.querySelector('#run').textContent=paused?'Play':'Pause';};for(const button of document.querySelectorAll('[data-time]'))button.onclick=()=>{paused=true;time=Number(button.dataset.time);document.querySelector('#run').textContent='Play';draw();};function draw(){const now=Date.now();if(!paused)time+=Math.max(0,Math.min(100,now-last))/1000;last=now;c.drawImage(photo,0,0);engine.render(c,time,1);large.clearRect(0,0,740,600);large.drawImage(photo,365,315,185,300,0,0,370,600);large.drawImage(frame,365,315,185,300,370,0,370,600);small.clearRect(0,0,440,600);small.drawImage(photo,766,375,44,120,0,0,220,600);small.drawImage(frame,766,375,44,120,220,0,220,600);document.querySelector('#state').textContent=`Time ${time.toFixed(1)} s`;}function loop(){draw();requestAnimationFrame(loop);}loop();};
</script>
