<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>Бездна · живые обои</title><link rel="icon" href="data:,"><link rel="stylesheet" href="preview.css">
  <style>.city{background-image:url(assets/abyss.png)}</style>
</head>
<body>
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script>
  <main aria-label="Глубоководная станция: течение и пузырьки, мерцающие прожекторы, служебные окна, движущийся лифт и жизнь за стеклом обсерватории">
    <div class="city" aria-hidden="true"></div><canvas id="atmosphere" aria-hidden="true"></canvas><div class="shade" aria-hidden="true"></div>
  </main>
  <aside id="controls" aria-label="Управление предпросмотром">
    <div class="caption"><span class="eyebrow">ЖИВЫЕ ОБОИ / НА ДНЕ ОКЕАНА</span><h1>Бездна<span>04</span></h1><p>Там, где не бывает рассвета, всё ещё горит свет.</p></div>
    <div class="actions">
      <button id="play" aria-label="Приостановить анимацию"><span id="playIcon">Ⅱ</span><span id="playText">Пауза</span></button>
      <label class="rain-label" for="current">Сила течения<input id="current" type="range" min="0" max="100" value="70" aria-label="Сила течения"></label>
      <button id="fullscreen" aria-label="Полный экран"><span>⛶</span><span>Во весь экран</span></button>
    </div><div class="hint">пробел — пауза · F — полный экран · H — скрыть панель</div>
  </aside>
  <div id="error" role="alert" hidden>Не удалось загрузить сцену. Откройте её из полной папки обоев.</div>
  <script src="abyss-water.js"></script><script src="abyss-radiance.js"></script><script src="abyss-practicals.js"></script><script src="abyss-lighting.js"></script><script src="abyss-elevator.js"></script><script src="abyss-interior.js"></script><script src="abyss-transit.js"></script><script src="abyss-scene.js"></script>
</body>
</html>
